
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a192f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agroh" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <title>Agroh | Agronomist OS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              'apple-gray': '#F5F5F7',
              'clinical-blue': '#0071E3',
              'midnight': '#020617',
              'navy-950': '#020617',
              'clinical-purple': '#8B5CF6',
              'clinical-cyan': '#06B6D4',
              'clinical-green': '#10B981'
            }
          }
        }
      }
    </script>
    <style>
      * {
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        margin: 0;
        min-height: 100vh;
        width: 100vw;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #F8FAFC 0%, #F1F5F9 100%);
        color: #1E293B;
        overflow: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;
        line-height: 1.6;
        letter-spacing: -0.01em;
        font-size: 16px;
      }
      .dark body {
        background: #020617;
        color: #F8FAFC;
      }
      #root {
        height: 100vh;
        width: 100%;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Sharp UI - No Blur, Sharp Borders, High Contrast */
      .glass-panel {
        transition: all 0.2s ease;
      }
      .glass-panel {
        background: #FFFFFF;
        border: 1px solid #94A3B8;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      }
      .dark .glass-panel {
        background: #0F172A;
        border: 1px solid #334155;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      }
      
      /* High contrast for light mode */
      .text-slate-500 {
        color: #475569;
      }
      .dark .text-slate-500 {
        color: #64748B;
      }
      .text-slate-400 {
        color: #64748B;
      }
      .dark .text-slate-400 {
        color: #94A3B8;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0,0,0,0.1);
        border-radius: 10px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
      }
      
      @keyframes highlightPulse {
        0% { outline: 0px solid #3b82f6; outline-offset: 0px; box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
        50% { outline: 4px solid #3b82f6; outline-offset: 4px; box-shadow: 0 0 20px 10px rgba(59, 130, 246, 0.4); }
        100% { outline: 0px solid #3b82f6; outline-offset: 0px; box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
      }
      .highlight-element {
        animation: highlightPulse 2s ease-in-out infinite;
        z-index: 1001 !important;
        position: relative;
        border-radius: 1rem;
      }
      
      /* Markdown Styles */
      .markdown-body {
        font-size: inherit;
        line-height: 1.6;
        word-wrap: break-word;
      }
      .markdown-body p, .markdown-body ul, .markdown-body ol, .markdown-body blockquote, .markdown-body pre {
        margin-bottom: 1em;
      }
      .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 {
        margin-top: 1.5em;
        margin-bottom: 0.5em;
        font-weight: 800;
        line-height: 1.25;
        text-transform: uppercase;
        letter-spacing: -0.02em;
      }
      .markdown-body ul {
        list-style-type: disc;
        padding-left: 1.5em;
      }
      .markdown-body ol {
        list-style-type: decimal;
        padding-left: 1.5em;
      }
      .markdown-body strong {
        font-weight: 700;
        color: inherit;
      }
      .markdown-body blockquote {
        padding: 0 1em;
        color: #64748B;
        border-left: 0.25em solid #E2E8F0;
      }
      .dark .markdown-body blockquote {
        color: #94A3B8;
        border-left: 0.25em solid #1E293B;
      }

      .v-input-elegant {
        width: 100%;
        background-color: #F8FAFC;
        border: 2px solid #E2E8F0;
        border-radius: 1.5rem;
        padding: 1rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: #1E293B;
        outline: none;
        transition: all 0.2s ease;
      }
      .dark .v-input-elegant {
        background-color: rgba(255, 255, 255, 0.03);
        border-color: rgba(255, 255, 255, 0.1);
        color: #F8FAFC;
      }
      .v-input-elegant:focus {
        border-color: #3b82f6;
        background-color: #FFFFFF;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
      }
      .dark .v-input-elegant:focus {
        background-color: rgba(255, 255, 255, 0.05);
        border-color: #3b82f6;
      }
      .v-input-elegant::placeholder {
        color: #94A3B8;
        opacity: 0.6;
      }
      .dark .v-input-elegant::placeholder {
        color: #475569;
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script>
      // Global error listener to catch early crashes and display them on screen
      window.onerror = function(message, source, lineno, colno, error) {
        const root = document.getElementById('root');
        if (root && root.innerHTML === '') {
          root.innerHTML = `
            <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #020617; color: white; font-family: sans-serif; text-align: center; padding: 20px;">
              <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 40px; border-radius: 24px; max-width: 600px; width: 100%;">
                <h1 style="color: #ef4444; margin-bottom: 16px; font-size: 24px;">FALLO DE CARGA DEL SISTEMA</h1>
                <p style="color: #94a3b8; line-height: 1.6; margin-bottom: 24px;">Se detectó un error crítico durante el arranque de la aplicación. Esto puede deberse a un archivo corrupto o una falla en el servidor de hosting.</p>
                <div style="background: rgba(0,0,0,0.5); padding: 16px; border-radius: 12px; font-family: monospace; font-size: 12px; text-align: left; color: #f87171; overflow-x: auto; border: 1px solid rgba(239, 68, 68, 0.2);">
                  <strong>Error:</strong> ${message}<br>
                  <strong>Origen:</strong> ${source}:${lineno}:${colno}
                </div>
                <button onclick="window.location.reload()" style="margin-top: 24px; padding: 12px 24px; background: #4f46e5; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600;">Reintentar Carga</button>
              </div>
            </div>
          `;
        }
        return false;
      };

      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
